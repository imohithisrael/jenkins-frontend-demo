
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Demo Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #2563eb;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin: 12px 0;
        }

        .status {
            margin-top: 25px;
            padding: 12px 22px;
            background: white;
            color: #2563eb;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to CI/CD Automation!</h1>
        <p>This website is deployed using Docker and Jenkins.</p>
        <p>Changes pushed to GitHub will be deployed automatically.</p>
        <div class="status">Deployment Status: Live</div>
    </div>
</body>
</html>
